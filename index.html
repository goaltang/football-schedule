<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>赛程 · 每日足球</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B0E0C'/%3E%3Ccircle cx='16' cy='16' r='8.5' fill='none' stroke='%23D8FF47' stroke-width='2'/%3E%3Cpath d='M16 7.5v17M7.5 16h17' stroke='%23D8FF47' stroke-width='1' opacity='.45'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<header class="top">
  <div class="masthead">
    <h1>赛程</h1>
    <div class="mast-side">
      <span class="kicker">MATCHDAY FIXTURES</span>
      <span class="meta" id="updated"></span>
    </div>
  </div>

  <div class="datebar">
    <button class="nav" id="prevDay" aria-label="前一天">‹</button>
    <div class="days" id="days"></div>
    <button class="nav" id="nextDay" aria-label="后一天">›</button>
    <button class="btn refresh" id="refresh">刷新</button>
  </div>

  <div class="chips" id="chips"></div>
</header>

<main id="list" class="list"></main>

<footer class="foot">
  <span id="tz"></span>
  <span>数据：ESPN 公开接口 · 本地缓存</span>
</footer>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
