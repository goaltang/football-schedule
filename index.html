<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090C0A">
<title>赛程 · 每日足球</title>
<link rel="preconnect" href="https://site.api.espn.com">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23090C0A'/%3E%3Ccircle cx='16' cy='16' r='8.5' fill='none' stroke='%23D8FF47' stroke-width='2'/%3E%3Cpath d='M16 7.5v17M7.5 16h17' stroke='%23D8FF47' stroke-width='1' opacity='.45'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<header class="top">
  <div class="masthead">
    <h1>赛程</h1>
    <div class="mast-side">
      <span class="kicker">MATCHDAY FIXTURES</span>
      <span class="meta" id="updated"></span>
    </div>
  </div>

  <div class="day-hero">
    <div class="hero-main">
      <span class="hero-date" id="heroDate"></span>
      <span class="hero-wd" id="heroWd"></span>
      <span class="hero-rel" id="heroRel"></span>
    </div>
    <span class="hero-count" id="heroCount"></span>
  </div>
</header>

<div class="sticky-bar">
  <div class="datebar">
    <button class="nav" id="prevDay" aria-label="前一天">‹</button>
    <div class="days" id="days"></div>
    <button class="nav" id="nextDay" aria-label="后一天">›</button>
  </div>
</div>

<div class="filters">
  <div class="filter-toolbar">
    <button type="button" class="filter-toggle" id="filterToggle" aria-controls="chips" aria-expanded="false">联赛筛选 <span class="filter-count" id="filterCount"></span></button>
    <div class="secondary-actions">
      <div class="view-seg" role="group" aria-label="视图">
        <button type="button" class="seg" id="viewDay" aria-pressed="true">日</button>
        <button type="button" class="seg" id="viewWeek" aria-pressed="false">周</button>
      </div>
      <button class="btn today-jump" id="goToday">今天</button>
      <button class="btn refresh" id="refresh">刷新</button>
    </div>
  </div>
  <div class="chips" id="chips"></div>
</div>

<main id="list" class="list"></main>

<footer class="foot">
  <span id="tz"></span>
  <span>数据：ESPN 公开接口 · 本地缓存</span>
  <span class="foot-export">
    <button type="button" class="foot-btn" id="exportIcs">导出日历</button>
    <span class="foot-note" id="icsNote"></span>
  </span>
</footer>

<script src="config.js"></script>
<script src="team-names.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
