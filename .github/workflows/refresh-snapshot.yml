# 定时拉取 ESPN 赛程写入 snapshot/schedule.json，随 Pages 一起部署。
# 新设备首次打开时先用这份同源快照出数据，不必等浏览器直连 ESPN。
name: refresh-snapshot

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build-snapshot.js
      - name: Commit snapshot
        run: |
          if [ -n "$(git status --porcelain snapshot)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add snapshot
            git commit -m "chore: refresh schedule snapshot"
            git push
          fi
