# 定时拉取 ESPN 赛程写入 snapshot/schedule.json，随 Pages 一起部署。
# 新设备首次打开时先用这份同源快照出数据，不必等浏览器直连 ESPN。
name: refresh-snapshot

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.snapshot.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tools/build-snapshot.js
      - run: node tools/build-teams-snapshot.js
      - name: Commit snapshot
        id: snapshot
        run: |
          if [ -n "$(git status --porcelain snapshot)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add snapshot
            git commit -m "chore: refresh schedule snapshot"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
  # GITHUB_TOKEN pushes do not start the deployment workflow. Build and publish
  # the refreshed commit explicitly, using the same artifact pipeline as deploy.
  publish:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/regression.test.js
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
